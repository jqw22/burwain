name: Web app tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # A throwaway copy of Supabase with all migrations and the seed, plus a test mailbox (Mailpit).
      - name: Start local Supabase
        working-directory: .
        run: npx -y supabase@3.0.0 start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,storage-api,postgres-meta,supavisor
      - name: Point the app at local Supabase
        working-directory: .
        run: |
          npx -y supabase@3.0.0 status -o env > /tmp/sb.env
          . /tmp/sb.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "E2E_DB_URL=$DB_URL"
            echo "E2E_MAILPIT_URL=${MAILPIT_URL:-http://127.0.0.1:54324}"
            echo "E2E_SCREENSHOTS=${{ github.workspace }}/web/screenshots"
          } >> "$GITHUB_ENV"

      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p screenshots && npm run test:e2e -- --trace off
      - name: Screenshots of the signed-in pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: web/screenshots
          if-no-files-found: ignore
